
apiVersion: apps/v1
kind: Deployment

metadata:
  name: wisecow-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: wisecow

  template:
    metadata:
      labels:
        app: wisecow

    spec:
      containers:
        - name: wisecow
          image: muskanp/wisecow:c158621f8a57ed5afae5281e300f5e6eb74243e2
          imagePullPolicy: Never

          ports:
            - containerPort: 4499
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

